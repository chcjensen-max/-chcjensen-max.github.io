<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Periop Didactics — Anesthesia Journal Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="didactics">
<header class="site-header"><div id="site-header"></div></header>

<main>
  <p class="eyebrow">Lecture library</p>
  <h1 class="page-title">Periop Didactics</h1>
  <p class="lede" id="lastUpdated"></p>

  <h2 class="prose" style="font-family:var(--font-display); font-size:1.3rem; margin-top:36px;">Basic</h2>
  <div class="link-card-grid" id="basicGrid"></div>

  <h2 class="prose" style="font-family:var(--font-display); font-size:1.3rem;">Advanced</h2>
  <div class="link-card-grid" id="advancedGrid"></div>
</main>

<footer class="site-footer"><div id="site-footer"></div></footer>

<script src="data/didactics-data.js"></script>
<script src="js/components.js"></script>
<script>
  document.getElementById("lastUpdated").textContent = "Last updated: " + DIDACTICS_DATA.lastUpdated;
  function cards(list) {
    return list
      .map((l) => `<a class="link-card" href="${l.url}" target="_blank" rel="noopener">${l.title}</a>`)
      .join("");
  }
  document.getElementById("basicGrid").innerHTML = cards(DIDACTICS_DATA.basic);
  document.getElementById("advancedGrid").innerHTML = cards(DIDACTICS_DATA.advanced);
</script>
</body>
</html>
