:root{

}

.hero{padding:72px 0 40px}

  font-family:var(--display);

}

}

}
.hero-intro{max-width:56ch;margin:26px 0 0;color:var(--ink-2)}

.formats{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin:0 0 64px}
.format{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:24px}
.format-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.format h2{font-family:var(--display);font-size:1.25rem;font-weight:700;letter-spacing:-.01em;margin:0}
.format-summary{margin:0 0 10px;font-weight:600}
.format-detail{margin:0;font-size:15.5px;color:var(--ink-2)}

.tag{
  font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;padding:4px 8px;border-radius:2px;white-space:nowrap;
}
.tag-ebm{background:var(--accent-soft);color:var(--accent)}
.tag-deep{background:var(--alarm-soft);color:var(--alarm)}

.body-grid{display:grid;grid-template-columns:1fr;gap:0;padding-bottom:96px}
@media(min-width:1000px){
  .body-grid{grid-template-columns:210px 1fr;gap:56px}
}

.index{display:none}

}
.index-title{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--rule);
}
.index a{
  display:flex;gap:10px;text-decoration:none;font-family:var(--mono);font-size:12px;
  color:var(--ink-2);padding:6px 0;line-height:1.4;
}
.index a:hover{color:var(--accent)}

.index .idx-num{color:var(--ink-3);min-width:26px}
.index a[data-next="true"] .idx-num{color:var(--alarm)}

.session{

.badge-next{

@media print{
  body{background:#fff}
  .index,.masthead{display:none}
  .session{break-inside:avoid;border-color:#ccc;box-shadow:none}
}
</style>
</head>

<body>

<header class="masthead">
  <div class="masthead-in">
    <span class="mark" id="m-program"></span>
    <span class="mark-sub" id="m-year"></span>
  </div>
</header>

<main>
  <div class="shell">
    <section class="hero">
      <p class="hero-year" id="hero-year"></p>
      <h1 id="hero-title"></h1>
      <ul class="hero-meta" id="hero-meta"></ul>
      <div class="hero-intro" id="hero-intro"></div>
    </section>

    <section class="formats" id="formats" aria-label="Session format"></section>

    <div class="body-grid">
      <nav class="index" aria-label="Session index">
        <p class="index-title">Sessions</p>
        <div id="index"></div>
      </nav>
      <section id="sessions" aria-label="Schedule"></section>
    </div>
  </div>

  <div class="shell">
    <footer class="foot"><p id="foot"></p></footer>
  </div>
</main>

<script>
(function () {
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const parse = iso => { const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d); };
  const fmt = (dt, o) => dt.toLocaleDateString("en-US", o);
  const slug = n => "session-" + String(n).replace(/\./g, "-");

  function source(url) {
    try {
      const host = new URL(url).hostname.replace(/^www\./, "");
      for (const key in JOURNALS) if (host === key || host.endsWith("." + key)) return JOURNALS[key];
      return host;
    } catch (e) { return ""; }
  }

  const today = new Date(); today.setHours(0,0,0,0);
  const dated = PAGE.sessions.map(s => parse(s.date));
  const nextIdx = dated.findIndex(d => d >= today);   // -1 once the year is over
  const yearRunning = nextIdx !== -1;

  // masthead + hero
  document.getElementById("m-program").textContent = PAGE.program;
  document.getElementById("m-year").textContent = PAGE.year;
  document.getElementById("hero-year").textContent = PAGE.year;
  document.getElementById("hero-title").textContent = PAGE.program;
  document.title = PAGE.program + " Journal Club — " + PAGE.year;

  document.getElementById("hero-meta").innerHTML =
    (PAGE.meta || []).map(m => "<li>" + esc(m) + "</li>").join("") +
    "<li>" + PAGE.sessions.length + " sessions this academic year</li>";

  document.getElementById("hero-intro").innerHTML =
    (PAGE.intro || []).map(p => "<p>" + esc(p) + "</p>").join("");

  // format cards
  document.getElementById("formats").innerHTML = (PAGE.formats || []).map(f => `
    <article class="format">
      <div class="format-head">
        <h2>${esc(f.name)}</h2>
        <span class="tag tag-${esc(f.kind)}">${esc(f.minutes || "")}</span>
      </div>
      <p class="format-summary">${esc(f.summary || "")}</p>
      <p class="format-detail">${esc(f.detail || "")}</p>
    </article>`).join("");

  // sessions
  document.getElementById("sessions").innerHTML = PAGE.sessions.map((s, i) => {
    const dt = dated[i];
    const isNext = i === nextIdx;
    const isPast = yearRunning && dt < today;

    const groups = (s.groups || []).map(g => {
      const rows = (g.papers || []).length
        ? `<ul class="papers">` + g.papers.map(p => `
            <li><a class="paper" href="${esc(p.url)}" target="_blank" rel="noopener">
              <span class="paper-title">${esc(p.title)}</span>
              ${p.note ? `<span class="paper-note">${esc(p.note)}</span>` : ""}
              <span class="paper-src">${esc(source(p.url))} &#8599;</span>
            </a></li>`).join("") + `</ul>`
        : `<p class="tbd">To be announced.</p>`;
      return `<div class="group">
        <div class="group-head">
          <span class="tag tag-${esc(g.kind || "ebm")}">${esc(g.label)}</span>
          <span class="group-rule"></span>
        </div>${rows}</div>`;
    }).join("");

    return `<article class="session" id="${slug(s.number)}"
              ${isNext ? 'data-next="true" aria-current="date"' : ""}
              ${isPast ? 'data-past="true"' : ""}>
      <div class="session-top">
        <div class="date-rail">
          <div class="date-weekday">${fmt(dt, {weekday:"long"})}</div>
          <div class="date-day">${dt.getDate()}</div>
          <div class="date-month">${fmt(dt, {month:"short"})} ${dt.getFullYear()}</div>
        </div>
        <div>
          <div class="session-eyebrow">
            <span class="session-num">Session ${esc(s.number)}</span>
            ${isNext ? '<span class="badge-next">Up next</span>' : ""}
          </div>
          <h3>${esc(s.title)}</h3>
          ${s.person ? `<p class="person"><span class="role">${esc(s.role || "Moderator")}:</span> ${esc(s.person)}</p>` : ""}
          ${s.affiliation ? `<p class="affiliation">${esc(s.affiliation)}</p>` : ""}
          ${s.note ? `<p class="session-note">${esc(s.note)}</p>` : ""}
        </div>
      </div>
      ${groups ? `<div class="groups">${groups}</div>` : ""}
    </article>`;
  }).join("");

  // side index
  document.getElementById("index").innerHTML = PAGE.sessions.map((s, i) => `
    <a href="#${slug(s.number)}" ${i === nextIdx ? 'data-next="true"' : ""}>
      <span class="idx-num">${esc(s.number)}</span><span>${esc(s.title)}</span>
    </a>`).join("");

  document.getElementById("foot").textContent =
    PAGE.program + " journal club · " + PAGE.year + " · " + PAGE.sessions.length + " sessions";
})();
</script>
</body>
</html>
